name: deploy

# Se dispara en cada push a master, en paralelo con "tests" (decisión del dueño
# del proyecto, 2026-07-30).
#
# Antes esperaba a que "tests" terminara en verde. Se revirtió porque un test
# inestable dejaba el deploy en «skipped» sin aviso y el commit no llegaba a
# producción. La contrapartida es la de siempre: un commit con la suite en rojo
# ahora se despliega igual, así que hay que mirar el workflow "tests" aparte.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            cd /opt/palmcore
            bash deploy/scripts/deploy.sh
