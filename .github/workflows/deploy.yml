name: deploy

# Se dispara al terminar el workflow "tests", no en el push. Así producción solo
# recibe commits cuya suite pasó; antes deploy y tests corrían en paralelo y el
# despliegue salía incluso con los tests en rojo.
on:
  workflow_run:
    workflows: ['tests']
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: production
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            cd /opt/palmcore
            bash deploy/scripts/deploy.sh
